# Argo Rollouts controller only (chart 2.43.8, controller v1.10.1). No dashboard.
controller:
  replicas: 1
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {memory: 192Mi}
  # Metrics Service argo-rollouts-metrics only. Its ServiceMonitor is in platform/grafana: this
  # chart installs before kube-prometheus-stack, which brings the ServiceMonitor CRD.
  metrics:
    enabled: true
dashboard:
  enabled: false
installCRDs: true
