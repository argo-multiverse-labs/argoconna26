# Proxy config, merged into the chart values. ${LLM_BUDGET_USD} is filled in from .env by
# `make litellm-install` (envsubst), so the budget is not committed.
# Model IDs (claude-api skill, 2026-11-01): rca = Claude Sonnet 5.5, judge = Claude Opus 5.5.
proxy_config:
  model_list:
    - model_name: rca
      litellm_params:
        model: anthropic/claude-sonnet-5-5
        api_key: os.environ/ANTHROPIC_API_KEY
    - model_name: judge
      litellm_params:
        model: anthropic/claude-opus-5-5
        api_key: os.environ/ANTHROPIC_API_KEY
  litellm_settings:
    max_budget: ${LLM_BUDGET_USD}
    budget_duration: 30d
  router_settings:
    num_retries: 2
    request_timeout: 120
    allowed_fails: 2
    cooldown_time: 30
  general_settings:
    master_key: os.environ/PROXY_MASTER_KEY
    # every call is kept in the spend log (what's real: LiteLLM logs each call)
    store_prompts_in_spend_logs: true
