# Argo CD v3.5.6 (chart 10.11.6) for the demo. No admin password hash here:
# scripts read argocd-initial-admin-secret.
global:
  domain: localhost

configs:
  params:
    # plain http on NodePort 30080; the host port binds 127.0.0.1 only
    server.insecure: true
  cm:
    # D7: fast reconciliation for the demo, no random jitter
    timeout.reconciliation: 20s
    timeout.reconciliation.jitter: 0s
    # read-only API token account for HolmesGPT (the token is minted in a later slice)
    accounts.holmesgpt: apiKey
  rbac:
    policy.csv: |
      g, holmesgpt, role:readonly

server:
  replicas: 1
  service:
    type: NodePort
    nodePortHttp: 30080
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 256Mi}
  # Metrics Services only (server, controller, repo server). The ServiceMonitor is in
  # platform/grafana: Argo CD installs before kube-prometheus-stack, and the chart silently skips
  # a ServiceMonitor while its CRD is missing.
  metrics:
    enabled: true
  # The Rollout tab in the resource view (argoproj-labs/rollout-extension). The init container
  # downloads the release tar from GitHub each time the pod starts. IGNORE_FAILURE: without
  # network the server still starts, just without the tab.
  # Pins: EXTENSION_INSTALLER_VERSION and ROLLOUT_EXTENSION_VERSION in versions.env
  # (rollout-extension v0.4.x needs Argo CD v3.5 or later).
  extensions:
    enabled: true
    image:
      tag: v1.1.0
    extensionList:
      - name: rollout-extension
        env:
          - name: EXTENSION_URL
            value: https://github.com/argoproj-labs/rollout-extension/releases/download/v0.4.1/extension.tar
          - name: IGNORE_FAILURE
            value: "true"

controller:
  replicas: 1
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 768Mi}
  metrics:
    enabled: true

repoServer:
  replicas: 1
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 384Mi}
  metrics:
    enabled: true

redis:
  enabled: true
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {memory: 128Mi}

redis-ha:
  enabled: false

dex:
  enabled: false

# chart 10.11.6 has no applicationSet.enabled switch, so the controller is scaled to zero
applicationSet:
  replicas: 0

notifications:
  enabled: true
  # secrets.sh owns argocd-notifications-secret, so the chart and the script never fight over it
  secret:
    create: false
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {memory: 128Mi}
