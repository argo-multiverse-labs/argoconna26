apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  labels:
    app: loadgen
    example.dev/owner: payments-team
    example.dev/tier: "1"
    slo.example.dev/success-rate: "99"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loadgen
  template:
    metadata:
      labels:
        app: loadgen
        example.dev/owner: payments-team
        example.dev/tier: "1"
        slo.example.dev/success-rate: "99"
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: loadgen
          image: loadgen
          imagePullPolicy: Never
          env:
            - name: TARGET_URL
              value: http://checkout.demo.svc:8080/checkout
            - name: RPS
              value: "20"
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 128Mi}
