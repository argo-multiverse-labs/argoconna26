apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: checkout
  labels:
    app: checkout
    example.dev/owner: payments-team
    example.dev/tier: "1"
    slo.example.dev/success-rate: "99"
spec:
  replicas: 4
  selector:
    matchLabels:
      app: checkout
  template:
    metadata:
      labels:
        app: checkout
        example.dev/owner: payments-team
        example.dev/tier: "1"
        slo.example.dev/success-rate: "99"
      annotations:
        example.dev/config-version: "9"
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: checkout
          image: checkout
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: checkout-config
          env:
            - name: SLO_TARGET
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['slo.example.dev/success-rate']
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 192Mi}
  strategy:
    canary:
      steps:
        - setWeight: 25
        - pause: {duration: 20s}
        - setWeight: 50
        - pause: {duration: 20s}
      analysis:
        templates:
          - templateName: checkout-success-rate
        args:
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Latest
          - name: slo-target
            valueFrom:
              fieldRef:
                fieldPath: metadata.labels['slo.example.dev/success-rate']
