[project]
name = "checkout"
version = "1.0.0"
description = "Demo checkout service: calls pricing with a configurable timeout"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "uvicorn>=0.32",
  "prometheus-client==0.26.0",
  "opentelemetry-sdk==1.45.1",
  "opentelemetry-exporter-otlp-proto-http==1.45.1",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "pytest-asyncio>=0.24", "respx>=0.21"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
