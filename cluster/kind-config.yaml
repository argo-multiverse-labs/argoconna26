# Rendered with envsubst at create time (values from versions.env and demo.env).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ${CLUSTER_NAME}
nodes:
  - role: control-plane
    image: ${KIND_NODE_IMAGE}
    extraPortMappings:
      # Argo CD UI (http, server runs --insecure)
      - containerPort: ${PORT_ARGOCD}
        hostPort: ${PORT_ARGOCD}
        listenAddress: "${HOST_BIND}"
        protocol: TCP
      # Grafana
      - containerPort: ${PORT_GRAFANA}
        hostPort: ${PORT_GRAFANA}
        listenAddress: "${HOST_BIND}"
        protocol: TCP
      # Prometheus
      - containerPort: ${PORT_PROMETHEUS}
        hostPort: ${PORT_PROMETHEUS}
        listenAddress: "${HOST_BIND}"
        protocol: TCP
      # bridge
      - containerPort: ${PORT_BRIDGE}
        hostPort: ${PORT_BRIDGE}
        listenAddress: "${HOST_BIND}"
        protocol: TCP
      # cdevents-sim
      - containerPort: ${PORT_SIM}
        hostPort: ${PORT_SIM}
        listenAddress: "${HOST_BIND}"
        protocol: TCP
      # LiteLLM
      - containerPort: ${PORT_LITELLM}
        hostPort: ${PORT_LITELLM}
        listenAddress: "${HOST_BIND}"
        protocol: TCP
  - role: worker
    image: ${KIND_NODE_IMAGE}
