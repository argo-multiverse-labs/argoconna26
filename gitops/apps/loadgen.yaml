apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loadgen
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/argo-multiverse-labs/argoconna26.git
    targetRevision: main
    path: apps/loadgen
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
